name: Build Android APK

on:
  push:
    branches: [ main, master, Master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --legacy-peer-deps
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.custom.macroexecutor",
            "appName": "MacroExecutor",
            "webDir": "dist"
          }
          EOF
          npm run build
          rm -rf android
          npx cap add android

      - name: Inject Native Kotlin & C++ Engines (QuickJS + Luau)
        run: |
          PKG_DIR="android/app/src/main/java/com/custom/macroexecutor"
          CPP_DIR="android/app/src/main/cpp"
          RES_XML="android/app/src/main/res/xml"
          mkdir -p "$PKG_DIR" "$CPP_DIR" "$RES_XML"

          cp native-addon/MacroAccessibilityService.kt "$PKG_DIR/"
          cp native-addon/MacroBridgePlugin.kt "$PKG_DIR/"
          cp native-addon/native-bridge.cpp "$CPP_DIR/"

          GH="https://github.com"
          git clone --depth 1 "${GH}/bellard/quickjs.git" "$CPP_DIR/quickjs"
          git clone --depth 1 "${GH}/luau-lang/luau.git" "$CPP_DIR/luau"

          cat << 'EOF' > "$CPP_DIR/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.22.1)
          project("macro_engine")
          set(CMAKE_CXX_STANDARD 17)

          set(LUAU_BUILD_CLI OFF CACHE BOOL "" FORCE)
          set(LUAU_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LUAU_BUILD_WEB OFF CACHE BOOL "" FORCE)
          set(LUAU_WERROR OFF CACHE BOOL "" FORCE)
          add_subdirectory(luau)

          add_library(quickjs STATIC
              quickjs/quickjs.c
              quickjs/libregexp.c
              quickjs/libunicode.c
              quickjs/cutils.c
              quickjs/dtoa.c
          )
          target_compile_definitions(quickjs PRIVATE CONFIG_VERSION="2024-01-13" _GNU_SOURCE)
          target_include_directories(quickjs PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})

          add_library(macro_engine SHARED
              native-bridge.cpp
          )

          target_link_libraries(macro_engine
              quickjs
              Luau.Compiler
              Luau.VM
              android
              log
              m
              dl
          )
          EOF

          XML_NS="http://schemas.android.com/apk/res/android"
          cat << EOF > "$RES_XML/accessibility_service_config.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="${XML_NS}"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > /tmp/perms.txt
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
          EOF

          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          with open("/tmp/perms.txt", "r") as f:
              perms = f.read()
          content = content.replace("<application", perms + "\n    <application", 1)
          service_xml = """<service android:name=".MacroAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" /></service></application>"""
          content = content.replace("</application>", service_xml)
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          '

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.custom.macroexecutor;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private int permStep = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MacroBridgePlugin.class);
                  super.onCreate(savedInstanceState);
                  requestRuntimeStorageAndNotifications();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  advanceSpecialPermissions();
              }

              private void requestRuntimeStorageAndNotifications() {
                  List<String> needed = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                      }
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), 2001);
                  }
              }

              private void advanceSpecialPermissions() {
                  // Step 1: Display Over Other Apps (Floating Overlay)
                  if (permStep <= 1 && !Settings.canDrawOverlays(this)) {
                      permStep = 2;
                      Toast.makeText(this, "Step 1/4: Allow Display Over Other Apps", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      return;
                  }

                  // Step 2: All Files / Storage Access (Android 11+)
                  if (permStep <= 2 && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !Environment.isExternalStorageManager()) {
                      permStep = 3;
                      Toast.makeText(this, "Step 2/4: Allow Storage Access for Scripts & Screenshots", Toast.LENGTH_LONG).show();
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                      return;
                  }

                  // Step 3: Ignore Battery Optimizations (Prevents background macro killing)
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (permStep <= 3 && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                      permStep = 4;
                      Toast.makeText(this, "Step 3/4: Allow Background Running (Ignore Battery Optimization)", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName())));
                      return;
                  }

                  // Step 4: Accessibility Service (Required for Screen Taps & Swipes)
                  if (permStep <= 4 && !isAccessibilityEnabled()) {
                      permStep = 5;
                      Toast.makeText(this, "Step 4/4: Enable MacroExecutor in Accessibility", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  }
              }

              private boolean isAccessibilityEnabled() {
                  String expected = getPackageName() + "/" + MacroAccessibilityService.class.getCanonicalName();
                  String enabled = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabled == null) return false;
                  TextUtils.SimpleStringSplitter splitter = new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabled);
                  while (splitter.hasNext()) {
                      if (splitter.next().equalsIgnoreCase(expected)) return true;
                  }
                  return false;
              }
          }
          EOF

      - name: Configure Gradle for Kotlin, Coroutines & CMake NDK
        run: |
          sed -i 's/dependencies {/dependencies {\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"/' android/build.gradle
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle

          cat << 'EOF' >> android/app/build.gradle

          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
              }
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: MacroExecutor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
