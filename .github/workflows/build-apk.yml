name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --legacy-peer-deps
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.custom.macroexecutor",
            "appName": "MacroExecutor",
            "webDir": "dist"
          }
          EOF
          npm run build
          rm -rf android
          npx cap add android

      - name: Inject Native Kotlin & C++ Engines (QuickJS + Luau)
        run: |
          PKG_DIR="android/app/src/main/java/com/custom/macroexecutor"
          CPP_DIR="android/app/src/main/cpp"
          RES_XML="android/app/src/main/res/xml"
          mkdir -p "$PKG_DIR" "$CPP_DIR" "$RES_XML"

          cp native-addon/MacroAccessibilityService.kt "$PKG_DIR/"
          cp native-addon/MacroBridgePlugin.kt "$PKG_DIR/"
          cp native-addon/native-bridge.cpp "$CPP_DIR/"

          sed -i 's/JS_ToFloat64(ctx, &x, argv); JS_ToFloat64(ctx, &y, argv);/JS_ToFloat64(ctx, \&x, argv); JS_ToFloat64(ctx, \&y, argv);/' "$CPP_DIR/native-bridge.cpp"
          sed -i 's/JS_ToInt32(ctx, &ms, argv);/JS_ToInt32(ctx, \&ms, argv);/' "$CPP_DIR/native-bridge.cpp"

          GH="https://github.com"
          git clone --depth 1 "${GH}/bellard/quickjs.git" "$CPP_DIR/quickjs"
          git clone --depth 1 "${GH}/luau-lang/luau.git" "$CPP_DIR/luau"

          cat << 'EOF' > "$CPP_DIR/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.22.1)
          project("macro_engine")
          set(CMAKE_CXX_STANDARD 17)

          set(LUAU_BUILD_CLI OFF CACHE BOOL "" FORCE)
          set(LUAU_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LUAU_BUILD_WEB OFF CACHE BOOL "" FORCE)
          set(LUAU_WERROR OFF CACHE BOOL "" FORCE)
          add_subdirectory(luau)

          add_library(quickjs STATIC
              quickjs/quickjs.c
              quickjs/libregexp.c
              quickjs/libunicode.c
              quickjs/cutils.c
              quickjs/dtoa.c
          )
          target_compile_definitions(quickjs PRIVATE CONFIG_VERSION="2024-01-13" _GNU_SOURCE)
          target_include_directories(quickjs PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})

          add_library(macro_engine SHARED
              native-bridge.cpp
          )

          target_link_libraries(macro_engine
              quickjs
              Luau.Compiler
              Luau.VM
              android
              log
              m
              dl
          )
          EOF

          XML_NS="http://android.com"
          cat << EOF > "$RES_XML/accessibility_service_config.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="${XML_NS}"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|<service android:name=".MacroAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" /></service></application>|' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.custom.macroexecutor;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MacroBridgePlugin.class);
                  super.onCreate(savedInstanceState);
                  requestInitialPermissions();
              }

              private void requestInitialPermissions() {
                  SharedPreferences prefs = getSharedPreferences("macro_prefs", MODE_PRIVATE);
                  boolean firstLaunch = prefs.getBoolean("first_launch", true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1001);
                      }
                  }

                  if (firstLaunch) {
                      prefs.edit().putBoolean("first_launch", false).apply();
                      if (!Settings.canDrawOverlays(this)) {
                          Intent overlayIntent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivity(overlayIntent);
                      } else if (!isAccessibilityEnabled()) {
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      }
                  }
              }

              private boolean isAccessibilityEnabled() {
                  String expected = getPackageName() + "/" + MacroAccessibilityService.class.getCanonicalName();
                  String enabled = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (enabled == null) return false;
                  TextUtils.SimpleStringSplitter splitter = new TextUtils.SimpleStringSplitter(':');
                  splitter.setString(enabled);
                  while (splitter.hasNext()) {
                      if (splitter.next().equalsIgnoreCase(expected)) return true;
                  }
                  return false;
              }
          }
          EOF

      - name: Configure Gradle for Kotlin, Coroutines & CMake NDK
        run: |
          sed -i 's/dependencies {/dependencies {\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"/' android/build.gradle
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle

          cat << 'EOF' >> android/app/build.gradle

          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
              }
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: MacroExecutor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
