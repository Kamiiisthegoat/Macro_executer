name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --legacy-peer-deps
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.custom.macroexecutor",
            "appName": "MacroExecutor",
            "webDir": "dist"
          }
          EOF
          npm run build
          rm -rf android
          npx cap add android

      - name: Inject Native Kotlin & C++ Engines (QuickJS + Luau)
        run: |
          PKG_DIR="android/app/src/main/java/com/custom/macroexecutor"
          CPP_DIR="android/app/src/main/cpp"
          RES_XML="android/app/src/main/res/xml"
          mkdir -p "$PKG_DIR" "$CPP_DIR" "$RES_XML"

          cp native-addon/MacroAccessibilityService.kt "$PKG_DIR/"
          cp native-addon/MacroBridgePlugin.kt "$PKG_DIR/"
          cp native-addon/native-bridge.cpp "$CPP_DIR/"

          GH="https://github.com"
          git clone --depth 1 "${GH}/bellard/quickjs.git" "$CPP_DIR/quickjs"
          git clone --depth 1 "${GH}/luau-lang/luau.git" "$CPP_DIR/luau"

          cat << 'EOF' > "$CPP_DIR/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.22.1)
          project("macro_engine")
          set(CMAKE_CXX_STANDARD 17)

          file(GLOB LUAU_VM_SRC "luau/VM/src/*.cpp")
          file(GLOB LUAU_COMP_SRC "luau/Compiler/src/*.cpp")
          file(GLOB LUAU_AST_SRC "luau/Ast/src/*.cpp")

          include_directories(
              ${CMAKE_CURRENT_SOURCE_DIR}
              luau/VM/include
              luau/Compiler/include
              luau/Ast/include
              luau/Common/include
          )

          add_library(macro_engine SHARED
              native-bridge.cpp
              quickjs/quickjs.c
              quickjs/libregexp.c
              quickjs/libunicode.c
              quickjs/cutils.c
              quickjs/dtoa.c
              ${LUAU_VM_SRC}
              ${LUAU_COMP_SRC}
              ${LUAU_AST_SRC}
          )

          target_compile_definitions(macro_engine PRIVATE CONFIG_VERSION="2024-01-13")
          target_link_libraries(macro_engine android log m dl)
          EOF

          XML_NS="http://android.com"
          cat << EOF > "$RES_XML/accessibility_service_config.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="${XML_NS}"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          sed -i 's|</application>|<service android:name=".MacroAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" /></service></application>|' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.custom.macroexecutor;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MacroBridgePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Configure Gradle for Kotlin, Coroutines & CMake NDK
        run: |
          sed -i 's/dependencies {/dependencies {\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"/' android/build.gradle
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle

          cat << 'EOF' >> android/app/build.gradle

          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
              }
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: MacroExecutor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
